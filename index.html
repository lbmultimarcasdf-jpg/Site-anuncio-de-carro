      function App() {
        const [searchInput, setSearchInput] = useState("");
        const [searchTerm, setSearchTerm] = useState("");
        const [sortOrder, setSortOrder] = useState("recentes");
        const [showFilters, setShowFilters] = useState(false);
        const [selectedCar, setSelectedCar] = useState(null);

        const [draftFilters, setDraftFilters] = useState({ brand: "", fuel: "", maxPrice: "", maxKm: "" });
        const [appliedFilters, setAppliedFilters] = useState({ brand: "", fuel: "", maxPrice: "", maxKm: "" });

        const brands = [...new Set(cars.map((c) => c.brand))];

        const filteredCars = useMemo(() => {
          let result = [...cars];
          if (searchTerm.trim()) {
            const q = searchTerm.toLowerCase();
            result = result.filter((c) => c.title.toLowerCase().includes(q) || c.brand.toLowerCase().includes(q) || c.details.toLowerCase().includes(q));
          }
          if (appliedFilters.brand) result = result.filter((c) => c.brand === appliedFilters.brand);
          if (appliedFilters.fuel) result = result.filter((c) => c.fuel === appliedFilters.fuel);
          if (appliedFilters.maxPrice) result = result.filter((c) => c.price <= Number(appliedFilters.maxPrice));
          if (appliedFilters.maxKm) result = result.filter((c) => c.km <= Number(appliedFilters.maxKm));

          if (sortOrder === "precoAsc") result.sort((a, b) => a.price - b.price);
          if (sortOrder === "precoDesc") result.sort((a, b) => b.price - a.price);
          if (sortOrder === "kmAsc") result.sort((a, b) => a.km - b.km);
          if (sortOrder === "recentes") result.sort((a, b) => b.year - a.year);

          return result;
        }, [searchTerm, sortOrder, appliedFilters]);

        const handleSearch = () => setSearchTerm(searchInput);
        const applyFilters = () => setAppliedFilters(draftFilters);
        const clearFilters = () => {
          const empty = { brand: "", fuel: "", maxPrice: "", maxKm: "" };
          setDraftFilters(empty);
          setAppliedFilters(empty);
        };

        return (
          <div className="min-h-screen bg-darkBg">
            <Header />
            <main>
              <section className="max-w-7xl mx-auto px-4 pt-8">
                <div className="bg-gradient-to-r from-panel to-panelSoft border border-white/10 rounded-2xl p-6 md:p-10">
                  <p className="text-sm uppercase tracking-wider text-brandRed font-bold">LB Multimarcas</p>
                  <h1 className="mt-3 text-2xl md:text-4xl font-black leading-tight">Vendemos e compramos carros seminovos com transparência, segurança e o conforto que você merece.</h1>
                  <div className="mt-5 inline-flex items-center gap-2 text-gray-100 text-sm"><icons.Phone className="w-4 h-4 text-brandRed" />Atendimento rápido via WhatsApp</div>
                </div>
              </section>

              <SearchBar searchTerm={searchInput} setSearchTerm={setSearchInput} sortOrder={sortOrder} setSortOrder={setSortOrder} onSearch={handleSearch} onToggleFilter={() => setShowFilters((s) => !s)} />
              <FilterPanel isOpen={showFilters} filters={draftFilters} setFilters={setDraftFilters} onApply={applyFilters} onClear={clearFilters} brands={brands} />

              <section id="estoque" className="mt-8 scroll-mt-28">
                <div className="max-w-7xl mx-auto px-4">
                  {filteredCars.length === 0 ? (
                    <div className="bg-panel border border-white/10 rounded-xl p-6 text-center text-gray-100">Nenhum veículo encontrado com os filtros/pesquisa atuais.</div>
                  ) : (
                    <div className="grid sm:grid-cols-2 xl:grid-cols-4 gap-5">{filteredCars.map((car) => <CarCard key={car.id} car={car} onViewMore={setSelectedCar} />)}</div>
                  )}
                </div>
              </section>

              <InfoSections />
              <AboutSection />
            </main>

            <CarModal car={selectedCar} onClose={() => setSelectedCar(null)} />
            <FooterSection />
          </div>
        );
      }

      ReactDOM.createRoot(document.getElementById("root")).render(<App />);
    </script>
  </body>
</html>
